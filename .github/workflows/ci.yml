name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The oldest and the newest supported Python.
        python-version: ["3.11", "3.15"]
    steps:
      - uses: actions/checkout@v4

      # https://docs.astral.sh/uv/guides/integration/github/#installation
      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          version: "0.13.5"
          enable-cache: true
          cache-dependency-glob: |
            **/pyproject.toml
            **/uv.lock
      
      - name: Install dependencies
        run: uv sync --frozen --all-extras --dev --python ${{ matrix.python-version }}
      
      - name: Run tests
        run: uv run pytest --ignore=tests/test_e2e_smoke.py --junitxml=pytest-report.xml
      
      - name: Upload pytest test results
        uses: actions/upload-artifact@v4
        with:
          name: pytest-results-${{ matrix.python-version }}
          path: pytest-report.xml
        # Use always() to always run this step to publish test results when there are test failures
        if: ${{ always() }}

  version:
    # A PR that changes the server must raise the version above the latest
    # release (merging it releases that version); see scripts/check_version.py.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # the tags and the base branch

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          version: "0.13.5"

      - name: Check the version against the latest release
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          if [ -n "${BASE_REF}" ]; then
            uv run --no-project --with packaging python scripts/check_version.py --base "origin/${BASE_REF}"
          else
            uv run --no-project --with packaging python scripts/check_version.py
          fi
