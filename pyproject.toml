[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "gcore-mcp-server"
version = "1.2.0"
description = "MCP server for Gcore API"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "Gcore", email = "support@gcore.com" },
]
license = { text = "Apache-2.0" }
dependencies = [
    "gcore==0.62.0",  # exactly the reviewed SDK; upgrade with the catalog snapshot
    "fastmcp>=4.0.2,<5",
    "pydantic-monty>=1.4,<2",
]

[project.optional-dependencies]
dev = [
    "httpx>=0.28.1",
    "ruff>=0.1.0",
    "pytest>=7.0.0",
    "pytest-anyio>=0.0.0",
]

[project.scripts]
gcore-mcp-server = "gcore_mcp_server.server:main"

[tool.hatch.packages.find]
include = ["gcore_mcp_server*"]
namespaces = true

[tool.hatch.metadata]
allow-direct-references = true

[tool.uv]
required-version = ">=0.13.7"

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"

[tool.pyright]
include = ["gcore_mcp_server"]
typeCheckingMode = "strict"
reportMissingImports = true

[tool.pytest]
testpaths = ["tests"]
python_files = ["test_*.py"]
markers = ["live: talks to the real Gcore API (skipped without a key)"]

[dependency-groups]
dev = [
    "anthropic>=2.4.0",
    "build>=1.2.2.post1",
    "httpx>=0.28.1",
    "jsonschema>=4.25.1",
    "pyright>=1.1.397",
    "pytest>=8.3.5",
    "pytest-anyio>=0.0.0",
    "pytest-timeout>=2.4.0",
    "respx>=0.23.1",
    "tiktoken>=0.14.0",
]
